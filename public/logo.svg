<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none" width="100%" height="100%">
  <!-- Definition of gradients and filters -->
  <defs>
    <linearGradient id="socioBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#026CD2"/>
      <stop offset="100%" stop-color="#024B91"/>
    </linearGradient>
    <linearGradient id="solarOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D26"/>
      <stop offset="100%" stop-color="#E85908"/>
    </linearGradient>
    <linearGradient id="sunRayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA439"/>
      <stop offset="100%" stop-color="#F36F21"/>
    </linearGradient>
  </defs>

  <!-- Brand Emblem (Solar Array + Rising Sun) -->
  <g transform="translate(10, 8)">
    <!-- Sun disk and rays -->
    <circle cx="58" cy="24" r="16" fill="url(#sunRayGrad)"/>
    <path d="M58 2 V-2 M58 50 V46 M36 24 H32 M84 24 H80 M43 9 L40 6 M73 39 L76 42 M43 39 L40 42 M73 9 L76 6" stroke="#F36F21" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dynamic 3D Solar Panel Grid -->
    <polygon points="12,56 26,24 64,24 78,56" fill="url(#socioBlueGrad)"/>
    
    <!-- Cell Grid lines in White with Opacity -->
    <!-- Column dividers -->
    <line x1="30" y1="24" x2="33" y2="56" stroke="#FFFFFF" stroke-width="1.6" opacity="0.8"/>
    <line x1="45" y1="24" x2="45" y2="56" stroke="#FFFFFF" stroke-width="1.6" opacity="0.8"/>
    <line x1="60" y1="24" x2="57" y2="56" stroke="#FFFFFF" stroke-width="1.6" opacity="0.8"/>
    <!-- Row dividers -->
    <line x1="20" y1="35" x2="70" y2="35" stroke="#FFFFFF" stroke-width="1.6" opacity="0.8"/>
    <line x1="16" y1="46" x2="74" y2="46" stroke="#FFFFFF" stroke-width="1.6" opacity="0.8"/>

    <!-- Aluminum Mount Base in Solar Orange -->
    <path d="M8 60 H82" stroke="#F36F21" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="60" x2="28" y2="69" stroke="#0258A6" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="60" x2="62" y2="69" stroke="#0258A6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography Group -->
  <g transform="translate(110, 0)">
    <!-- "SOCIO" in Professional SOCIO Blue -->
    <text x="0" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="0.04em" fill="#0258A6">SOCIO</text>

    <!-- "SOLAR SYSTEMS" in Solar Orange -->
    <text x="2" y="72" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="16.5" letter-spacing="0.32em" fill="#F36F21">SOLAR SYSTEMS</text>

    <!-- Subtitle / Business descriptor in Subtle Deep Slate -->
    <text x="3" y="85" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="8.5" letter-spacing="0.22em" fill="#64748B">DISTRIBUTION &amp; SOLUTIONS</text>
  </g>
</svg>
